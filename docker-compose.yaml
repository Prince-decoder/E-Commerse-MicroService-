services:

  # ── 1. Starts FIRST ────────────────────────────────────────────────────────
  eureka-server:
    container_name: "ServerService"
    build: ServerService
    ports:
      - "8761:8761"
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761' 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 2. Starts after Eureka is HEALTHY ─────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: "postgres"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ashu
      POSTGRES_DB: EcomDb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my-network
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 3. Starts after Postgres is HEALTHY ───────────────────────────────────
  user-service:
    container_name: "UserService"
    build: UserService
    ports:
      - "8081:8081"
    networks:
      - my-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081' 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── 4. Starts after UserService is HEALTHY ────────────────────────────────
  product-service:
    container_name: "ProductService"
    build: ProductService
    ports:
      - "8082:8082"
    networks:
      - my-network
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082' 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── 5. Starts after ProductService is HEALTHY ─────────────────────────────
  cart-service:
    container_name: "CartService"
    build: CartService
    ports:
      - "8083:8083"
    networks:
      - my-network
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083' 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── 6. Starts after CartService is HEALTHY ────────────────────────────────
  order-service:
    container_name: "OrderService"
    build: OrderService
    ports:
      - "8084:8084"
    networks:
      - my-network
    depends_on:
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8084' 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  my-network:
    driver: bridge